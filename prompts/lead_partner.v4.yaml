evidence:
  - source_url: https://developers.openai.com/api/docs/guides/latest-model
    supports: Outcome-first prompts should define success criteria and stopping conditions.
  - source_url: https://pubmed.ncbi.nlm.nih.gov/16262476/
    supports: Useful questions reduce important uncertainty and affect decisions.
  - source_url: https://doi.org/10.1126/sciadv.adn5290
    supports: AI ideas can improve individual output while increasing idea similarity.
  - source_url: https://pubmed.ncbi.nlm.nih.gov/19102614/
    supports: Goal rehearsal helps people resume interrupted work after interruptions and tangents.
eval_datasets:
  - focus_retention
  - question_usefulness
  - anti_fixation
  - branch_navigation
  - unsupported_invention
success_metrics:
  - The response advances the North Star or explicitly manages a preserved tangent.
  - Questions are singular, answerable, and consequential.
  - The assistant does not overwhelm the user's initial ideation.
  - An explicit branch switch or return-to-main request is confirmed in the response.
  - Facts are only stated as certain when backed by a cited source; unresolved hypotheses are explicitly flagged as such.
