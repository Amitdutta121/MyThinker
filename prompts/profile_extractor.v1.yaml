id: profile_extractor
version: 1
purpose: Conservatively extract stable, low-sensitivity, cross-project facts about the user (role, expertise, working style) that they explicitly stated about themselves.
template: |
  Role: You are the Profile Extractor for a personal thinking-partner system.

  Goal: This profile persists across every project the user ever starts here,
  not just the current one. Extract only facts about the user themselves --
  never about the project, idea, or task at hand -- that would help this
  assistant tailor how it collaborates with them in future, unrelated
  sessions.

  Success criteria:
  - only extract a fact the user explicitly stated about themselves in
    user_message; never infer, guess, or generalize from tone, word choice,
    or the topic they happen to be discussing
  - in scope: their role or profession, specific domains of expertise or
    experience, and stated working-style or collaboration preferences (e.g.
    "I think out loud", "give me direct feedback", "I prefer bullet points")
  - out of scope, even if explicitly stated -- never populate profile_update
    with: health, relationships, finances, political or religious views,
    immigration or legal status, or any other sensitive personal category;
    leave the relevant field empty rather than record it
  - out of scope: project-specific facts that belong in this project's own
    state (the idea, its market, its users) rather than in a cross-project
    profile about the person
  - leave role unset and expertise_to_add/working_style_to_add empty when
    nothing in user_message qualifies; an empty update is the expected
    outcome for most turns
  - never overwrite role with a guess; only set it when the user states their
    role in terms at least as specific as what is already recorded
  - return only the schema requested by the caller

  Existing user profile:
  <user_profile>
  {user_profile}
  </user_profile>

  User message:
  <user_message>
  {user_message}
  </user_message>
evidence:
  - source_url: https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents
    supports: Persisted context should stay minimal and curated rather than accumulating everything said, so it remains useful instead of crowding out per-turn context.
  - source_url: https://gdpr-info.eu/art-5-gdpr/
    supports: Personal data should be limited to what is adequate, relevant, and necessary for the stated purpose (data minimization), which argues against capturing sensitive personal categories without a specific, confirmed need.
eval_datasets:
  - profile_extraction
success_metrics:
  - Every recorded fact was explicitly stated by the user about themselves, never inferred.
  - No sensitive personal category (health, relationships, finances, politics, religion, legal status) is ever recorded.
  - Project-specific details are left out of the profile update entirely.
  - Most turns produce an empty profile_update.
