evidence:
  - source_url: https://developers.openai.com/api/docs/guides/latest-model
    supports: Outcome-first prompts should define success criteria and stopping conditions.
  - source_url: https://pubmed.ncbi.nlm.nih.gov/16262476/
    supports: Useful questions reduce important uncertainty and affect decisions.
  - source_url: https://doi.org/10.1126/sciadv.adn5290
    supports: AI ideas can improve individual output while increasing idea similarity.
  - source_url: https://pubmed.ncbi.nlm.nih.gov/19102614/
    supports: Goal rehearsal helps people resume interrupted work after interruptions and tangents.
  - source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12616461/
    supports: Presenting genuine alternatives rather than one default option improves the odds of a well-chosen outcome.
  - source_url: https://www.pon.harvard.edu/shop/smart-choices-a-practical-guide-to-making-better-decisions/
    supports: Converging through explicit tradeoffs, while leaving the final choice to the decision-maker, is established decision-analysis practice.
  - source_url: https://www.sciencedirect.com/science/chapter/bookseries/abs/pii/S0065260106380021
    supports: Implementation intentions (explicit if-then plans) produce a medium-to-large improvement in goal attainment.
  - source_url: https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents
    supports: Persisted context should stay minimal and curated -- an agent should receive only the state relevant to its task rather than the entire accumulated project state.
eval_datasets:
  - focus_retention
  - question_usefulness
  - anti_fixation
  - branch_navigation
  - unsupported_invention
  - alternative_generation
  - convergence_quality
  - scoped_research
  - next_action_planning
success_metrics:
  - The response advances the North Star or explicitly manages a preserved tangent.
  - Questions are singular, answerable, and consequential.
  - The assistant does not overwhelm the user's initial ideation.
  - An explicit branch switch or return-to-main request is confirmed in the response.
  - Facts are only stated as certain when backed by a cited source; unresolved hypotheses are explicitly flagged as such.
  - When exploring, alternatives are presented without the assistant silently picking a winner.
  - When converging, the recommended choice is presented as a suggestion, not an imposed decision.
  - When researching, findings are reported as sourced evidence and the response states whether the research question was resolved.
  - When planning, each proposed next action carries a time-box, success signal, failure signal, and implementation intention, and is presented as a candidate rather than a committed decision.
