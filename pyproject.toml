[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mythinking"
version = "0.1.0"
description = "A personal, stateful AI thinking partner"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "beautifulsoup4>=4.15.0",
  "ddgs>=9.15.0",
  "fastapi>=0.115",
  "gpt-researcher>=0.15,<0.16",
  "httpx>=0.27",
  "langchain>=1.0",
  "langchain-openai>=1.0",
  "langchain-openrouter>=0.1",
  "langgraph>=1.0",
  "langgraph-checkpoint-sqlite>=3.0",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "pypdf>=5.0",
  "pyyaml>=6.0.2",
  "tavily-python>=0.8.0",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]

[project.scripts]
mythinking = "mythinking.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mythinking"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/mythinking/api.py" = ["B008"]  # FastAPI's Depends(...) is idiomatic in argument defaults

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
